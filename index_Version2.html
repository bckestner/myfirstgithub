<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concrete Volume Calculator</title>
  <style>
    :root {
      --bg: #f3f6f9;
      --card: #ffffff;
      --primary: #1f5f8b;
      --primary-dark: #184d72;
      --accent: #d9ecf7;
      --text: #1d2a36;
      --muted: #5c6975;
      --success: #1d7c4d;
      --border: #dfe7ee;
      --shadow: 0 12px 32px rgba(31, 95, 139, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #edf4fb 0%, #f9fbfd 100%);
      color: var(--text);
    }

    .card {
      width: min(100%, 520px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 2vw, 2.5rem);
      text-align: center;
      color: var(--primary-dark);
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--text);
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 14px 14px 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fff;
      color: var(--text);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(31, 95, 139, 0.12);
      outline: none;
    }

    .unit {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      pointer-events: none;
    }

    button {
      width: 100%;
      margin-top: 6px;
      padding: 15px 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      font-size: 1.02rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 20px rgba(31, 95, 139, 0.2);
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .result-box {
      margin-top: 24px;
      padding: 18px 16px;
      background: linear-gradient(135deg, #edf8f2 0%, #f4fbf6 100%);
      border: 1px solid #cfe9d9;
      border-radius: 12px;
      text-align: center;
    }

    .result-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--success);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #result {
      font-size: clamp(1.6rem, 2.2vw, 2.2rem);
      color: var(--success);
      font-weight: 800;
      line-height: 1.2;
    }

    .formula-note {
      margin-top: 18px;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
    }

    .formula-note strong {
      color: var(--text);
    }

    @media (max-width: 520px) {
      .card {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Concrete Volume Calculator</h1>
    <p class="subtitle">
      Estimate the amount of concrete needed in cubic yards.
    </p>

    <div class="field">
      <label for="length">Length (feet)</label>
      <div class="input-wrap">
        <span class="unit">ft</span>
        <input id="length" type="number" min="0" step="any" placeholder="Example: 20" />
      </div>
    </div>

    <div class="field">
      <label for="width">Width (feet)</label>
      <div class="input-wrap">
        <span class="unit">ft</span>
        <input id="width" type="number" min="0" step="any" placeholder="Example: 12" />
      </div>
    </div>

    <div class="field">
      <label for="depth">Depth (inches)</label>
      <div class="input-wrap">
        <span class="unit">in</span>
        <input id="depth" type="number" min="0" step="any" placeholder="Example: 4" />
      </div>
    </div>

    <button onclick="calculateConcrete()">Calculate</button>

    <div class="result-box">
      <span class="result-label">Concrete Needed</span>
      <div id="result">0.00 cubic yards</div>
    </div>

    <div class="formula-note">
      Formula: <strong>(length × width × depth in feet) ÷ 27</strong><br />
      Depth is converted from inches to feet before calculating.
    </div>
  </div>

  <script>
    function calculateConcrete() {
      const lengthFeet = parseFloat(document.getElementById("length").value);
      const widthFeet = parseFloat(document.getElementById("width").value);
      const depthInches = parseFloat(document.getElementById("depth").value);

      if (
        isNaN(lengthFeet) ||
        isNaN(widthFeet) ||
        isNaN(depthInches) ||
        lengthFeet <= 0 ||
        widthFeet <= 0 ||
        depthInches <= 0
      ) {
        document.getElementById("result").textContent = "Please enter valid values";
        return;
      }

      const depthFeet = depthInches / 12;
      const cubicFeet = lengthFeet * widthFeet * depthFeet;
      const cubicYards = cubicFeet / 27;

      document.getElementById("result").textContent =
        cubicYards.toFixed(2) + " cubic yards";
    }
  </script>
</body>
</html>
